over-note>span{color:var(--accent)}footer{padding:24px 6%;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#878d7f;font-size:9px;letter-spacing:.06em}.reader{max-width:820px;margin:auto;padding:40px 40px 100px;animation:appear .45s ease}.story-nav{display:flex;justify-content:space-between;align-items:center}.story-nav button{font-size:11px;color:var(--muted)}.story-nav button span{margin-left:15px}.progress{height:1px;background:var(--line);margin-top:20px}.progress span{height:1px;background:var(--accent);display:block}.scene-meta{margin-top:60px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;color:var(--muted)}.reader h1{font-family:var(--serif);font-size:35px;font-weight:500;letter-spacing:-.06em;line-height:1.65;margin:20px 0 42px}.reader article{font-family:var(--serif);font-size:16px;line-height:2.3;word-break:keep-all;overflow-wrap:anywhere}.reader article p{margin:0 0 25px}.choice-heading{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}.choice-heading span:last-child{font-size:9px}.choices{display:grid;gap:12px;margin-top:20px}.choice{text-align:left;border:1px solid var(--line);padding:23px 20px;display:grid;grid-template-columns:28px 1fr 15px;gap:12px;align-items:start;transition:background .2s,border-color .2s}.choice:hover{background:#242a22;border-color:#8c9773}.choice-number{font-size:10px;color:var(--accent);padding-top:3px}.choice strong{font-size:14px;font-weight:400;line-height:1.7;display:block;word-break:keep-all}.choice small{display:block;color:var(--muted);font-size:11px;line-height:1.8;margin-top:8px}.arrow{color:var(--accent)}.evidence{padding:20px 24px;border-left:1px solid var(--accent);background:#22271f;margin-top:35px}.evidence>p:not(.eyebrow){font-size:11px;line-height:1.9;color:#b9bdac}.ending-label{margin-top:65px}.ending h1{font-size:44px;margin-bottom:14px}.ending-lead{font-family:var(--serif);font-size:17px;color:var(--accent);margin-bottom:45px;line-height:1.9}.end-mark{text-align:center;margin:50px;color:var(--accent);font-size:30px}.end-note{text-align:center;color:var(--muted);font-size:12px;line-height:2}.ending>.primary{margin:35px auto}.credits{text-align:center;color:var(--muted);font-size:10px;line-height:2;margin-top:45px}dialog{background:#21261f;color:var(--paper);border:1px solid #697357;width:min(640px,90vw);max-height:80vh;padding:30px}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.dialog-top{display:flex;justify-content:space-between;align-items:center}.dialog-top h2{font-family:var(--serif);font-weight:400;font-size:23px}.dialog-top button{color:var(--accent);font-size:12px}.record{border-top:1px solid var(--line);padding:20px 0 10px}.record p{font-size:13px;line-height:1.9}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){header{height:72px}.brand span{display:none}.cover{padding:35px 7% 45px;gap:24px;min-height:0;position:relative;display:block}.cover-copy{position:relative;z-index:2}.cover-copy>.eyebrow{font-size:8px;max-width:200px}.cover h1{font-size:78px}.cover-art{position:absolute;width:42%;right:0;top:100px;height:390px;min-height:0;opacity:.48;border-right:0}.sun{width:160px;height:160px;top:60px}.chain{left:45%;transform:rotate(-19deg) scale(.75);transform-origin:top}.vertical,.art-caption{display:none}.description{max-width:65%;font-size:12px}.cover-note{grid-template-columns:1fr;gap:12px}.reader{padding:28px 23px 70px}.scene-meta{margin-top:40px;font-size:9px}.reader h1{font-size:29px;margin-bottom:32px}.reader article{font-size:15px;line-height:2.25}.choice{padding:18px 14px;gap:8px;grid-template-columns:22px 1fr 12px}.choice strong{font-size:13px}.choice-heading{flex-wrap:wrap}.ending h1{font-size:35px}footer{font-size:8px}footer span:last-child{display:none}.intro{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<header><a class="brand" href="">사슬의 바깥 <span>OUTSIDE THE CHAIN</span></a><button id="sound" aria-pressed="false">소리 꺼짐</button></header>

<main id="main"></main>
<footer><span>한 사람의 기록은 다른 사람의 운명이 된다.</span><span>INTERACTIVE FICTION / 01</span></footer>

<script>
const initial = () => ({ scene: 0, mercy: 0, truth: 0, refusal: 0, records: [], choices: {} });
const scenes = [
  { chapter: '01 / 남겨진 자리', title: '죽은 사람은 서명할 수 없다.', location: '항구도시 해안 · 사망등록소', time: '오전 8시 10분', paragraphs: [
    '어머니가 죽은 다음 날, 나는 출근했다. 장례를 치를 돈이 없었고, 결근하면 이번 달 장례공제금이 지급되지 않았다. 두 사실 사이에는 아무런 모순도 없다고 규정집은 말했다.',
    '나는 시청의 기록원이다. 사람들이 겪은 일을 빈칸에 맞추는 일을 한다. 창밖에서는 해체 중인 방파제에 망치가 닿았다. 세 번씩. 어머니가 약을 달라고 벽을 두드리던 간격이었다.',
    '첫 신청자는 노인 오윤이었다. 사흘 전 바다에서 돌아오지 않은 아들의 사망증명서를 원했다. 시신이 없으면 실종이고, 실종자의 가족에게는 유족 배급표가 나오지 않는다. 그는 빈 도시락통을 책상 위에 놓았다.',
    '“죽었다고 쓰면, 수색은 끝나는 겁니까?” 그가 물었다. 그렇다고 대답하자 한참 동안 도시락 뚜껑을 열었다 닫았다. “그럼 살아 있다고 쓰면, 오늘 뭘 먹습니까?”'
  ], choices: [
    { label: '사망 추정으로 접수한다.', hint: '배급을 받을 수 있다. 수색은 종료된다.', key: 'death', effects: {mercy:1}, record: '오윤의 아들, 사망 추정. 유족 배급 승인. 수색 종료 요청 자동 발송.' },
    { label: '실종으로 남기고 내 점심을 건넨다.', hint: '수색은 계속된다. 오늘 이후의 배급은 없다.', key:'search', effects:{truth:1}, record:'오윤의 아들, 실종 유지. 유족 배급 불승인. 기록원이 개인 식사를 제공함.' }
  ]},
  { chapter:'02 / 살아 있는 서명', title:'누군가는 남아야 한다.', location:'등록소 · 퇴근 창구',time:'오후 6시 40분', paragraphs:[
    '동료 서진은 낮에는 여기서 서류를 나르고, 밤에는 시의 공동근무표에 따라 병원 청소와 항만 경비를 번갈아 맡는다. 지난주에는 어머니가 입원했던 병동을 닦았다. 내일 밤에는 방파제 안쪽 출입문을 지킬 차례다. 그녀의 아버지가 다음 날 수술을 받는다. 교대할 사람이 없으면 수술 동의서를 쓰러 갈 수 없다고 했다.',
    '마침 내 책상에 야간 노동면제 신청서가 있었다. 서진의 것이었다. 나는 승인 도장을 찍을 수 있었다. 다만 면제된 근무는 없어지지 않는다. 명단의 다음 사람에게 넘어간다.',
    '다음 이름은 민호. 열아홉. 방파제 야간 경비. 안전교육 수료란은 비어 있었다. 서진은 그 이름을 보고 신청서를 다시 끌어당겼다.',
    '“내가 알아서 할게.” 그녀가 말했다. 알아서 한다는 말은 이 도시에서 더 이상 도움을 청하지 않겠다는 뜻이었다.'
  ], choices:[
    {label:'서진의 면제를 승인한다.',hint:'민호가 내일 야간 근무를 맡는다.',key:'exempt',effects:{mercy:1},record:'서진, 가족 간병으로 야간 근무 면제. 대체 인원: 민호.'},
    {label:'신청서를 보류하고 직접 교대를 요청한다.',hint:'자격 없는 기록원의 요청은 받아들여지지 않을 수 있다.',key:'hold',effects:{truth:1},record:'서진 면제 보류. 기록원의 대체 근무 신청은 경비 자격 미보유로 반려됨.'}
  ]},
  {chapter:'03 / 볼 수 있는 것',title:'경고에는 날짜가 필요하다.',location:'시청 · 지하 기록실',time:'다음 날, 오후 2시',paragraphs:[
    '방파제 철거 담당 기사 강해가 젖은 도면을 들고 왔다. 빗물이 아니라 땀이었다. 그는 안쪽 사슬이 부식되어 만조 때 출입문이 버티지 못한다고 했다. 야간 작업을 멈추려면 위험확인서가 필요했다.',
    '확인서에는 현장 검사자의 서명이 있어야 했다. 검사자는 다음 주에 돌아온다. 강해는 자신이 찍은 사진을 펼쳤다. 금속의 갈라진 틈으로 하늘이 보였다.',
    '나는 사진을 보았지만 현장을 보지는 않았다. 빈 검사란 아래에 내 이름을 쓰면 중지 요청은 접수된다. 요청이 접수된다고 작업이 멈추는 것은 아니다.',
    '강해가 말했다. “당신에게 안전하다고 써 달라는 게 아닙니다. 위험하다는 말을, 도착하게 해 달라는 겁니다.”'
  ],choices:[
    {label:'직접 확인한 것으로 서명한다.',hint:'경고를 즉시 전달한다. 서명은 사실과 다르다.',key:'signed',effects:{mercy:1},record:'기록원이 현장 검사자로 서명. 긴급 중지 요청 접수. 실제 현장 방문 기록 없음.'},
    {label:'사진과 증언을 첨부해 미확인 위험으로 접수한다.',hint:'사실대로 남긴다. 정식 중지 심사는 뒤로 밀린다.',key:'reported',effects:{truth:1},record:'미확인 위험 보고 접수. 현장 검사 미완료로 정기 심사 대기.'}
  ]},
  {chapter:'04 / 서류가 지나간 곳',title:'답신은 사고보다 늦게 왔다.',location:'남쪽 방파제 · 통제선',time:'밤 11시 20분',paragraphs:s=>[
    '방파제 안쪽 출입문이 무너졌다. 야간 경비 한 명이 바다에 빠졌다. 구조선이 도착했을 때에는 밧줄만 남아 있었다. 이름은 민호였다.',
    s.choices[1]==='exempt'?'서진 대신 근무한 날이었다. 내가 찍은 도장은 이제 누군가의 마지막 출근 시간을 설명하는 문장이 되었다.':'서진도 현장에 있었다. 민호는 원래 맡은 외곽 순찰 중 그녀의 호루라기 소리를 듣고 안으로 들어갔다. 내 보류는 누구도 그곳에서 빼내지 못했다.',
    s.choices[2]==='signed'?'중지 요청은 오후 네 시에 현장에 도착했다. 소장은 검사자 명단에서 내 이름을 찾지 못했다. 그는 진위 확인 회신을 보냈고, 답을 기다리는 동안 근무를 유지했다.':'내 보고는 내일 아침 심사 목록에 들어 있었다. 담당자는 봉투에 찍힌 접수 시각을 보여 주었다. 기한을 어긴 사람은 없었다.',
    '통제선 너머에서 강해가 내게 종이 한 장을 건넸다. 석 달 전 작성한 보수 예산 반려서였다. “시가 예산을 줄였다는 걸 알고 있었어요. 그때 그만뒀어야 했는데.” 그는 종이를 놓고도 손가락을 떼지 못했다.'
  ],choices:[
    {label:'반려서를 조사위원회에 제출한다.',hint:'도시의 결정과 강해의 침묵이 함께 드러난다.',key:'submit',effects:{truth:1},record:'보수 예산 반려서 원본 제출. 기사 강해의 사전 위험 인지 확인.'},
    {label:'강해의 이름을 가린 사본을 제출한다.',hint:'예산 결정은 드러난다. 증거의 출처는 의심받는다.',key:'redact',effects:{mercy:1},record:'제출된 예산 반려서에 작성자 정보 누락. 원본 대조 요청.'}
  ]},
  {chapter:'05 / 그가 원한 것',title:'유족이라는 이름.',location:'시립 장례소 · 복도',time:'사흘 뒤',paragraphs:s=>[
    '민호의 누나 은재가 나를 기다렸다. 그녀는 앉지 않았다. 무슨 말을 듣든 곧바로 일어날 수 있게 서 있는 사람처럼 보였다.',

function choose(state, index) {
  const choice = scenes[state.scene]?.choices[index];
  if (!choice) throw new Error('존재하지 않는 선택');
  const next = structuredClone(state);
  for (const [k,v] of Object.entries(choice.effects)) next[k] += v;
  next.choices[state.scene] = choice.key;
  next.records.push({chapter:scenes[state.scene].chapter, text:choice.record});
  next.scene++;
  return next;
}

// Rebuild a save from legal choices; never trust stored records or counters.
function restore(value) {
  if (!value || !Number.isInteger(value.scene) || value.scene < 0 || value.scene > scenes.length || !Array.isArray(value.records) || value.records.length !== value.scene || !value.choices || typeof value.choices !== 'object' || Array.isArray(value.choices)) return null;
  let state = initial();
  for (let i = 0; i < value.scene; i++) {
    const index = scenes[i].choices.findIndex(choice => choice.key === value.choices[i]);
    if (index < 0) return null;
    state = choose(state, index);
  }
  return state;
}

function scrollTop(){window.scrollTo({top:0,behavior:'instant'}); main.querySelector('h1')?.focus({preventScroll:true});}
function home(){
 main.innerHTML=`<section class="cover"><div class="cover-copy"><p class="eyebrow">AN ORIGINAL STORY INSPIRED BY ABSURDISM</p><p class="intro">선의는 어디에서<br>죄가 되는가.</p><h1 tabindex="-1">사슬의<br><em>바깥</em><span class="period">.</span></h1><p class="description">한 번의 서명. 한 사람의 죽음.<br>그리고 서로의 이유에 묶인 사람들.<br>당신은 이 도시의 기록원입니다.</p><div class="start-actions"><button class="primary" id="start">${saved?'처음부터 시작':'이야기 시작'} <span>↗</span></button>${saved?'<button class="secondary" id="resume">이어하기 →</button>':''}</div><p class="meta">약 15–25분 · 9개 장면 · 3개의 결말<br>죽음, 애도, 제도적 폭력에 관한 이야기를 담고 있습니다.</p></div><div class="cover-art" aria-hidden="true"><div class="sun"></div><div class="chain"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="horizon"></div><span class="art-caption">해안, 어느 여름의 기록<br>ARCHIVE Nº 0001</span><span class="vertical">THE WORLD DOES NOT ANSWER.</span></div></section><section class="cover-note"><span>작품에 관하여</span><p>알베르 카뮈의 《이방인》이 던진 질문에서 출발한 독립적인 이야기입니다. 원작의 인물과 사건을 재현하지 않습니다. 정답을 고르는 대신, 당신이 남긴 말과 그 말이 닿은 사람들을 기억해 주세요.</p></section>`;
 document.querySelector('#start').onclick=()=>{if(saved && !confirm('저장된 진행을 지우고 처음부터 시작할까요?'))return;state=initial();save();render();};
 document.querySelector('#resume')?.addEventListener('click',()=>{state=structuredClone(saved);render();});
}
function toolbar(){return `<nav class="story-nav"><span class="eyebrow">${state.scene<scenes.length?scenes[state.scene].chapter:'EPILOGUE / 남은 사람들'}</span><button id="open-records">기록 ${String(state.records.length).padStart(2,'0')} <span>↗</span></button></nav><div class="progress" role="progressbar" aria-label="이야기 진행" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${state.scene}"><span style="width:${state.scene/9*100}%"></span></div>`;}
function render(){
 if(state.scene>=scenes.length){finish();return;}
 const scene=scenes[state.scene];const paragraphs=typeof scene.paragraphs==='function'?scene.paragraphs(state):scene.paragraphs;
 main.innerHTML=`<section class="reader">${toolbar()}<div class="scene-meta"><span>${scene.location}</span><span>${scene.time}</span></div><h1 tabindex="-1">${scene.title}</h1><article>${paragraphs.map(p=>`<p>${escape(p)}</p>`).join('')}</article>${state.scene===8?`<aside class="evidence"><p class="eyebrow">당신이 남긴 기록</p>${state.records.slice(0,7).map(r=>`<p>${escape(r.text)}</p>`).join('')}</aside>`:''}<div class="choice-heading"><span>당신은 어떻게 하겠습니까?</span><span>${saveAvailable?'선택은 자동으로 기록됩니다':'현재 진행은 이 창에서만 유지됩니다'}</span></div><div class="choices">${scene.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="choice-number">0${i+1}</span><span><strong>${escape(c.label)}</strong><small>${escape(c.hint)}</small></span><span class="arrow">↗</span></button>`).join('')}</div></section>`;
 main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state=choose(state,Number(b.dataset.choice));save();render();});bindArchive();scrollTop();
}
function finish(){const end=ending(state);main.innerHTML=`<section class="reader ending">${toolbar()}<p class="eyebrow ending-label">ENDING ${end.number} / 3</p><h1 tabindex="-1">${end.name}</h1><p class="ending-lead">${end.lead}</p><article>${end.paragraphs.map(p=>`<p>${escape(p)}</p>`).join('')}</article><div class="end-mark">○</div><p class="end-note">이 이야기는 당신의 선택을 점수로 매기지 않습니다.<br>남은 것은 기록과, 그 기록보다 큰 사람들입니다.</p><button class="primary" id="restart">다른 선택으로 다시 시작 <span>↗</span></button><p class="credits">사슬의 바깥 · 독립 창작 인터랙티브 픽션<br>부조리, 책임, 그리고 함께 살아가는 일에 관하여</p></section>`;document.querySelector('#restart').onclick=()=>{if(!confirm('현재 결말을 지우고 새 이야기를 시작할까요?'))return;state=initial();save();render();};bindArchive();scrollTop();}
function bindArchive(){document.querySelector('#open-records').onclick=()=>{document.querySelector('#records').innerHTML=state.records.length?state.records.map(r=>`<section class="record"><span class="eyebrow">${escape(r.chapter)}</span><p>${escape(r.text)}</p></section>`).join(''):'<p>아직 기록이 없습니다.</p>';document.querySelector('#archive').showModal();};}
document.querySelector('#close-archive').onclick=()=>document.querySelector('#archive').close();
let audio, oscillators=[], gain;
document.querySelector('#sound').onclick=async()=>{const button=document.querySelector('#sound');if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){button.textContent='소리 미지원';return;}audio=new Audio();gain=audio.createGain();gain.gain.value=0;gain.connect(audio.destination);[110,164.81,220.3].forEach(freq=>{const o=audio.createOscillator();o.frequency.value=freq;o.connect(gain);o.start();oscillators.push(o);});}await audio.resume();const active=button.getAttribute('aria-pressed')==='true';gain.gain.setTargetAtTime(active?0:0.012,audio.currentTime,0.6);button.setAttribute('aria-pressed',String(!active));button.textContent=active?'소리 꺼짐':'소리 켜짐';};
home();

</script>
</body></html>
